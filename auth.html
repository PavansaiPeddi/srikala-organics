<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Srikala Organics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <nav class="nav wrap">

            <a href="index.html" class="brand">
                <span>🌿</span>

                <div>
                    <strong>Srikala</strong>
                    <small>ORGANICS</small>
                </div>
            </a>

            <div class="navlinks">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#shop">
                    Shop
                </a>

                <a href="cart.html">
                    🛒 Cart
                </a>

            </div>

        </nav>

    </header>


    <!-- LOGIN / SIGNUP -->
    <main class="page wrap">

        <div class="auth-wrap">

            <div class="panel auth-card">

                <!-- TABS -->

                <div class="auth-tabs">

                    <button
                        type="button"
                        id="login-tab"
                        class="active">

                        Login

                    </button>

                    <button
                        type="button"
                        id="signup-tab">

                        Create Account

                    </button>

                </div>


                <!-- MESSAGE -->

                <div id="auth-message"></div>


                <!-- LOGIN FORM -->

                <form id="login-form">

                    <span class="eyebrow">
                        WELCOME BACK
                    </span>

                    <h1 class="auth-title">
                        Login to Srikala
                    </h1>


                    <div class="field">

                        <label for="login-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <div
                        class="field"
                        style="margin-top:15px;">

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn primary auth-submit">

                        Login

                    </button>

                </form>


                <!-- SIGNUP FORM -->

                <form
                    id="signup-form"
                    style="display:none;">

                    <span class="eyebrow">
                        JOIN SRIKALA
                    </span>

                    <h1 class="auth-title">
                        Create Account
                    </h1>


                    <div class="field">

                        <label for="signup-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signup-name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required>

                    </div>


                    <div
                        class="field"
                        style="margin-top:15px;">

                        <label for="signup-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="signup-email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <div
                        class="field"
                        style="margin-top:15px;">

                        <label for="signup-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signup-password"
                            placeholder="Create a password"
                            minlength="6"
                            autocomplete="new-password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn primary auth-submit">

                        Create Account

                    </button>


                    <p class="auth-note">

                        Your password is securely handled
                        by Supabase.

                    </p>

                </form>


                <!-- BACK -->

                <p class="auth-back">

                    <a
                        href="index.html"
                        class="text-btn">

                        ← Continue Shopping

                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- IMPORTANT:
         config.js MUST load before auth.js -->

    <script src="config.js"></script>

    <script src="auth.js"></script>

</body>

</html>
