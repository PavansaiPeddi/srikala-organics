<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Srikala Organics</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><nav class="nav wrap"><a class="brand" href="index.html"><span>🌿</span><div><strong>Srikala</strong><small>ORGANICS</small></div></a><a class="cart-pill" href="cart.html">← Cart</a></nav></header>
<main class="page wrap"><div class="page-title"><span class="eyebrow">CHECKOUT</span><h1>Complete your order</h1></div><div id="message"></div><div class="checkout-grid"><form class="panel" id="checkout-form"><div class="form-grid">
<div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Phone</label><input id="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div>
<div class="field full"><label>Address</label><textarea id="address" required></textarea></div><div class="field"><label>City</label><input id="city" required></div><div class="field"><label>PIN code</label><input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div>
</div><button class="btn primary" style="width:100%;margin-top:20px" type="submit">Place order →</button></form><aside class="panel summary"><h2 style="font-size:28px">Order summary</h2><div id="summary"></div></aside></div></main>
<footer><div class="footer-bottom">© 2026 Srikala Organics</div></footer><script src="config.js"></script><script src="app.js"></script><script src="checkout.js"></script></body></html>
