<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Srikala Organics</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><nav class="nav wrap"><a class="brand" href="index.html"><span>🌿</span><div><strong>Srikala</strong><small>ORGANICS</small></div></a><a class="cart-pill" href="cart.html">🛒 Cart <b id="cart-count">0</b></a></nav></header>
<main class="page wrap"><div id="product-detail" class="panel">Loading product…</div></main><footer><div class="footer-bottom">© 2026 Srikala Organics</div></footer>
<script src="config.js"></script><script src="app.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get("id"),box=document.getElementById("product-detail");const ps=await getProducts();const p=ps.find(x=>String(x.id)===String(id));if(!p){box.innerHTML="<div class='empty'>Product not found.<br><br><a class='btn primary' href='index.html#shop'>Back to shop</a></div>";return;}box.innerHTML=`<div class="checkout-grid" style="align-items:center"><div class="product-img" style="height:420px;border-radius:20px"><img src="${productImage(p)}" alt="${safe(p.name)}"></div><div><span class="eyebrow">SRIKALA ORGANICS</span><h1>${safe(p.name)}</h1><div class="weight">${safe(p.weight||"")}</div><p class="desc" style="font-size:15px;min-height:auto">${safe(p.description||"")}</p><div class="price" style="font-size:32px;margin:20px 0">₹${Number(p.price).toLocaleString("en-IN")}</div><p class="stock">${Number(p.stock||0)} available</p><button class="btn primary" onclick='addToCart(${JSON.stringify(p)})'>Add to cart</button></div></div>`;})();
</script></body></html>
